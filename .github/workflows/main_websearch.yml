name: Build and deploy Python project to Azure Function App - websearch

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.13'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies into deployment package
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --target=".python_packages/lib/site-packages" \
            -r requirements.txt

      - name: Verify dependencies and crawler imports
        run: |
          export PYTHONPATH=".python_packages/lib/site-packages:$PYTHONPATH"

          python -c "import requests; import azure.functions; import bs4; print('Basic imports OK')"

          python -c "from azure.data.tables import TableServiceClient, UpdateMode; from azure.core import MatchConditions; print('Azure Table imports OK')"

          python -c "from azure.storage.queue import QueueServiceClient; print('Azure Queue imports OK')"

          python -c "from azure.storage.blob import BlobServiceClient; print('Azure Blob imports OK')"

          python -c "import services.crawl_state; print('Crawl state module OK')"

      - name: Verify Python syntax
        run: |
          export PYTHONPATH=".python_packages/lib/site-packages:$PYTHONPATH"
          python -m compileall -q .

      - name: Create deployment package
        run: |
          zip -r release.zip . \
            -x "venv/*" \
            -x ".venv/*" \
            -x ".git/*" \
            -x "local.settings.json" \
            -x "data/*" \
            -x "release.zip" \
            -x "__pycache__/*" \
            -x "*.pyc"

      - name: Verify deployment package
        run: |
          unzip -t release.zip

          unzip -l release.zip | grep "services/crawl_state.py"

          unzip -l release.zip | grep ".python_packages/lib/site-packages/azure/data/tables"

          echo "Deployment package verification completed."

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7EF46499BD3445F2B4D1D7ADABB10B25 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A5E9EB3F8232481081949EC9FAD70420 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_51AC32F889A842A88C160CD073CFC436 }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: websearch
          slot-name: Production
          package: release.zip